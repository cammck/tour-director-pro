name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Firebase config
        # Replaces placeholder values in index.html with secrets stored in GitHub
        run: |
          sed -i "s|YOUR_API_KEY|${{ secrets.FIREBASE_API_KEY }}|g" public/index.html
          sed -i "s|YOUR_PROJECT_ID.firebaseapp.com|${{ secrets.FIREBASE_AUTH_DOMAIN }}|g" public/index.html
          sed -i "s|YOUR_PROJECT_ID.appspot.com|${{ secrets.FIREBASE_STORAGE_BUCKET }}|g" public/index.html
          sed -i "s|YOUR_SENDER_ID|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" public/index.html
          sed -i "s|YOUR_APP_ID|${{ secrets.FIREBASE_APP_ID }}|g" public/index.html
          # Replace project ID last so the above domain replacements don't double-match
          sed -i "s|YOUR_PROJECT_ID|${{ secrets.FIREBASE_PROJECT_ID }}|g" public/index.html

      - name: Deploy to Firebase Hosting (preview on PR)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: pr-${{ github.event.pull_request.number }}

      - name: Deploy to Firebase Hosting (production on push to main)
        if: github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
