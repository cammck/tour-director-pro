name: Deploy to Firebase

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Firebase config into index.html
        run: |
          sed -i "s|YOUR_API_KEY|${{ secrets.FIREBASE_API_KEY }}|g" public/index.html
          sed -i "s|YOUR_PROJECT_ID.firebaseapp.com|${{ secrets.FIREBASE_AUTH_DOMAIN }}|g" public/index.html
          sed -i "s|YOUR_PROJECT_ID.appspot.com|${{ secrets.FIREBASE_STORAGE_BUCKET }}|g" public/index.html
          sed -i "s|YOUR_SENDER_ID|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" public/index.html
          sed -i "s|YOUR_APP_ID|${{ secrets.FIREBASE_APP_ID }}|g" public/index.html
          sed -i "s|YOUR_PROJECT_ID|${{ secrets.FIREBASE_PROJECT_ID }}|g" public/index.html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules (on push to main only)
        if: github.event_name == 'push'
        run: firebase deploy --only firestore:rules --project ${{ secrets.FIREBASE_PROJECT_ID }} --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy to Firebase Hosting (preview on PR)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: pr-${{ github.event.pull_request.number }}

      - name: Deploy to Firebase Hosting (production on push to main)
        if: github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
